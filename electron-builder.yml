appId: com.gestionfinanciere.app
productName: Outil de Gestion Financiere
copyright: Copyright © 2024
directories:
  output: release/${version}
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - node_modules/sql.js/**/*
  - package.json
asarUnpack:
  - node_modules/sql.js/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  perMachine: false
  displayLanguageSelector: false
